version: 2
project_name: spotagentiq

builds:
  - main: ./cmd/spotagentiq
    binary: spotagentiq
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md
      - spotagentiq.example.json

checksum:
  name_template: SHA256SUMS

changelog:
  use: github
  filters:
    exclude:
      - "^gofmt"

release:
  github:
    owner: mckoy-labs
    name: spotagentiq
