version: 2
project_name: spotagentiq

builds:
  - main: ./cmd/spotagentiq
    binary: spotagentiq
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md
      - spotagentiq.example.json

checksum:
  name_template: SHA256SUMS

# Keyless signing with Sigstore: the release workflow's GitHub identity signs
# the checksum file, so there is no private key to store or leak. Anyone can
# check that a download came from this repository's CI:
#
#   cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json #     --certificate-identity-regexp '^https://github.com/mckoy-labs/spotagentiq/' #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   sha256sum --check --ignore-missing SHA256SUMS
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

# Homebrew: brew install mckoy-labs/tap/spotagentiq
#
# The formula is pushed to github.com/mckoy-labs/homebrew-tap with a deploy
# key that can write to that one repository and nothing else. Without the
# HOMEBREW_TAP_DEPLOY_KEY secret (forks, the dry run) the formula is still
# generated into dist/ but not pushed.
brews:
  - name: spotagentiq
    repository:
      owner: mckoy-labs
      name: homebrew-tap
      branch: main
      git:
        url: "ssh://git@github.com/mckoy-labs/homebrew-tap.git"
        private_key: '{{ if index .Env "HOMEBREW_TAP_DEPLOY_KEY" }}{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}{{ end }}'
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_DEPLOY_KEY" }}auto{{ else }}true{{ end }}'
    directory: Formula
    homepage: https://www.spotagentiq.com
    description: "Human approval and a tamper-evident audit log for AI agent tool calls"
    license: Apache-2.0
    commit_author:
      name: spotagentiq-release
      email: releases@spotagentiq.com
    commit_msg_template: "spotagentiq {{ .Tag }}"
    test: |
      assert_match version.to_s, shell_output("#{bin}/spotagentiq version")

changelog:
  use: github
  filters:
    exclude:
      - "^gofmt"

release:
  github:
    owner: mckoy-labs
    name: spotagentiq
