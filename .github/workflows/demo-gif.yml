# Records the README demo (docs/demo.gif, docs/demo.mp4) from demo.tape and
# commits it. Run it by hand whenever the demo output changes.
name: demo-gif
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: make build && echo "$PWD/bin" >> "$GITHUB_PATH"
      - uses: charmbracelet/vhs-action@v2
        with:
          path: demo.tape
      - uses: actions/upload-artifact@v4
        with:
          name: demo
          path: |
            docs/demo.gif
            docs/demo.mp4
      - name: Commit the recording
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/demo.gif docs/demo.mp4
          git diff --cached --quiet || git commit -m "Re-record demo"
          git push
